# Let apps make their own sandbox (user namespaces), like Debian does.
# Ubuntu 24.04 blocks this unless an AppArmor profile allows it; on Migood OS
# those profiles weren't loaded at boot, so Migood Games, Chromium and Dolphin
# (Flatpak's bwrap) were all denied ("failed to find unprivileged_userns profile").
kernel.apparmor_restrict_unprivileged_userns = 0
