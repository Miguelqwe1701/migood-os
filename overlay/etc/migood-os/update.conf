# Migood OS updater settings (read by /usr/lib/migood-os/update)
# SERVERS: Migood server addresses, tried in order. If the first is blocked
# (e.g. by Cloudflare's bot check) or down, the next one is used.
SERVERS=https://www.welltypers.it.com https://wth5zs3z-3001.usw3.devtunnels.ms
# CHANNEL: stable, or beta for Migood Beta members.
CHANNEL=beta
# GITHUB_RELEASES: Fallback when the Migood server doesn't have the latest update
# or is unreachable. Pulls the latest release/pre-release directly from GitHub.
GITHUB_RELEASES=https://api.github.com/repos/Miguelqwe1701/migood-os/releases
