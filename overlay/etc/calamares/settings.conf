# Migood OS installer (Calamares). Pages: welcome, language/time, keyboard,
# disk, summary -> install -> finished. There is no "create user" page on
# purpose: the account is made at first boot by signing in with Migood Games
# (migood-firstboot.service + migood-setup), like a Chromebook.
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
- id: removelive
  module: shellprocess
  config: shellprocess_removelive.conf
- id: migood
  module: shellprocess
  config: shellprocess_migood.conf
- id: logs
  module: shellprocess
  config: shellprocess_logs.conf
# A damaged USB stick: check the system file first, fetch a good copy if needed.
- id: verify
  module: migoodcheck
  config: migoodcheck_verify.conf
- id: repair
  module: migoodcheck
  config: migoodcheck_repair.conf
- id: cleanup
  module: migoodcheck
  config: migoodcheck_cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - summary
- exec:
  - migoodcheck@verify
  - partition
  - mount
  - migoodcheck@repair
  - unpackfs
  - migoodcheck@cleanup
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - networkcfg
  - hwclock
  - shellprocess@removelive
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@migood
  - shellprocess@logs
  - umount
- show:
  - finished

branding: migood
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
