# Disk page. Btrfs with @ and @home so Timeshift can snapshot before every
# Migood OS update (and roll back). "Encrypt system" is offered (LUKS).
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

# Ubuntu 24.04's calamares patch (enable-only-present-with-encryption-partitions)
# leaves partOnlyPresentWithEncryption uninitialized in the default layout,
# which skips creating "/" when encryption is off. Defining partitionLayout
# explicitly sets onlyPresentWithEncryption: false so "/" is always created.
partitionLayout:
    - name: "root"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
      minSize: 5GiB
      noEncrypt: false
      onlyPresentWithEncryption: false

# Swap: none. zram-tools already gives compressed swap in memory, and a swap
# file on Btrfs in Linux 6.8 fails in fstab (chattr +C +m).
userSwapChoices: [ none ]
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs" ]
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
