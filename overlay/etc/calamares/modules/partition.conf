# Disk page. Btrfs with @ and @home so Timeshift can snapshot before every
# Migood OS update (and roll back). "Encrypt system" is offered (LUKS).
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"
userSwapChoices: [ none, file ]
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
