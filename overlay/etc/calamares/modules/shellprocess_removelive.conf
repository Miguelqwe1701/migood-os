# Inside the new system: remove the things only the USB needs.
---
dontChroot: false
timeout: 900
script:
    - "-rm -f /usr/share/applications/migood-install.desktop /etc/casper.conf"
    # "-" = a failure here doesn't fail the install (e.g. a package that was
    # never installed makes apt exit 100).
    - command: "-apt-get purge -y casper calamares calamares-settings-ubuntu-common"
      timeout: 900
