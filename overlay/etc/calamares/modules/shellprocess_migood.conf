# Inside the new system: first boot = Migood setup (sign in -> your account).
---
dontChroot: false
timeout: 120
script:
    - "-rm -f /var/lib/migood-os/setup-done"
    - "-sh -c '[ -d /etc/NetworkManager/system-connections ] && find /etc/NetworkManager/system-connections -type f -exec sed -i s/permissions=user:None:;/permissions=/g {} + || true'"
    - "systemctl enable migood-firstboot.service migood-os-update.timer migood-os-apply.service migood-fan.service migood-drivers.service"
    - "/usr/lib/migood-os/migood-graphics-setup"
