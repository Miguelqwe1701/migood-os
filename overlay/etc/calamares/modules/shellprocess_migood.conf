# Inside the new system: first boot = Migood setup (sign in -> your account).
---
dontChroot: false
timeout: 60
script:
    - "-rm -f /var/lib/migood-os/setup-done"
    - "-sed -i 's/permissions=user:None:;/permissions=/g' /etc/NetworkManager/system-connections/*"
    - "systemctl enable migood-firstboot.service migood-os-update.timer migood-os-apply.service migood-fan.service"
