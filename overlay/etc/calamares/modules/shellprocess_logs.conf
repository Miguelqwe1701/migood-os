# Saves the installer's log into the new system (/var/log/installer), so a
# problem after installing can still be looked into. settings.conf used this
# instance (shellprocess@logs) but the file was missing. Never fails the install.
---
dontChroot: true
timeout: 60
script:
    - "-mkdir -p ${ROOT}/var/log/installer"
    - "-sh -c 'for f in /root/.cache/calamares/session.log /home/*/.cache/calamares/session.log; do [ -f \"$f\" ] && cp \"$f\" ${ROOT}/var/log/installer/; done; true'"

